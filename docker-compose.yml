services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jizhang
      POSTGRES_PASSWORD: jizhang
      POSTGRES_DB: jizhang
    ports:
      - "5432:5432"
    volumes:
      - jizhang_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jizhang -d jizhang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jizhang_pg:
