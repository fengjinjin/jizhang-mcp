[project]
name = "jizhang-mcp"
version = "1.0.0"
description = "jizhang 记账 MCP 与 REST 后端"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14,<5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "asgi-lifespan>=2.1",
]

[project.scripts]
jizhang-mcp = "jizhang_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jizhang_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
